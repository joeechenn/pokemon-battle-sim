[workspace]
resolver = "3"
members = ["crates/sim-core"]

# Shared by every crate; each crate opts in with `edition.workspace = true`.
[workspace.package]
edition = "2024"
license = "MIT"

# Panic on integer overflow in release builds too (debug already does), so an
# overflow bug fails loudly everywhere instead of silently wrapping.
[profile.release]
overflow-checks = true
