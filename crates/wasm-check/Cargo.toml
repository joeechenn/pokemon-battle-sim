[package]
name = "wasm-check"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runs the reference match compiled to WebAssembly, to check it plays identically to the native build."
publish = false

# `cdylib` produces a standalone .wasm module that JavaScript can load.
[lib]
crate-type = ["cdylib"]

[dependencies]
sim-core = { path = "../sim-core" }
